# GitHub Pages + npm CI/CD configuration
# This file configures GitHub Actions to deploy apps/landing to GitHub Pages

name: Deploy Landing Page

on:
  push:
    branches:
      - main

jobs:
  deploy-landing:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
